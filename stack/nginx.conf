# Frontend (SPA) + proxy reverso da API no mesmo origin.
# /api/* e repassado ao backend com strip do prefixo: /api/csrf -> backend:8080/csrf.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Fallback da SPA: rotas de pagina (ex.: /redefinir-senha?token=...)
  # caem no index.html em vez de 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
